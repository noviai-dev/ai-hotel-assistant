# Install as /etc/nginx/conf.d/ai-hotel-assistant.conf.
# This server block is included inside the main nginx.conf http block.
# Copy the CONTENTS of frontend/dist/ into the root directory below.
server {
    listen 80;
    server_name _;

    root /var/www/ai-hotel-assistant;
    index index.html;
    charset utf-8;

    # Vite assets have content hashes and can be cached long-term.
    # Missing assets must return 404 instead of the SPA HTML document.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Always revalidate HTML so deployments load the latest asset filenames.
    location = /index.html {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    # Vue Router History mode: supports direct visits and date-route refreshes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
